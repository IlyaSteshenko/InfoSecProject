<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПБП Восстановление пароля</title>
    <link rel="stylesheet" href="../static/css/style.css" th:href="@{/css/style.css}">
    <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
</head>
<body>
<div class="head">
    <div class="logo">
        <div class="logoFirst">Патентное бюро</div>
        <div class="logoSecond">Победа</div>
    </div>
</div>

<p th:text="${error}" style="color: red; font-size: 20px;"></p>
<div class="formsContainer">
    <form class="formItem" id="sendEmail">
        <h1>Восстановление пароля</h1>


        <label for="email">Электронная почта</label>
        <div class="inputContainer">
            <input type="email" name="email" class="loginField" id="email" required>
        </div>
        <div class="wrapper">
            <input type="submit" class="registerButton btn" value="Отправить код">

            <!--    <a class="btn registerButton" th:href="@{/recover_password}">-->
            <!--      <div>Восстановить пароль</div>-->
            <!--    </a>-->
        </div>
    </form>
    <form class="formItem hidden" id="codeCheck">
        <p>Введите код, мы отправили его на почту</p>

        <div class="codeFieldsContainer">
            <input type="text" maxlength="1" name="digit_1" id="digit_1" class="codeField">
            <input type="text" maxlength="1" name="digit_2" id="digit_2" class="codeField">
            <input type="text" maxlength="1" name="digit_3" id="digit_3" class="codeField">
            <input type="text" maxlength="1" name="digit_4" id="digit_4" class="codeField">
            <input type="text" maxlength="1" name="digit_5" id="digit_5" class="codeField">
            <input type="text" maxlength="1" name="digit_6" id="digit_6" class="codeField">


        </div>
        <button type="button" class="btn registerButton">Отправить код заново</button>


    </form>
    <form class="formItem hidden" id="setPassword">
        <label for="password">Новый пароль</label>
        <div class="inputContainer">
            <input type="password" name="password" class="loginField exposing" id="password">
            <a class="passwordView"></a>
        </div>
        <label for="password2">Повторите пароль</label>
        <div class="inputContainer">
            <input type="password" name="password2" class="loginField exposing" id="password2">
            <a class="passwordView"></a>
        </div>
        <input type="submit" value="Изменить пароль" class="btn registerButton">
    </form>
</div>
<script>
    let passwordFields = document.querySelectorAll(".exposing")
    let eyes = document.querySelectorAll(".passwordView")
        eyes.forEach((btn) => {
        btn.addEventListener("click", () => {
            if (btn.classList.contains("peeked")) {
                eyes.forEach(eye => eye.classList.remove("peeked"));
                passwordFields.forEach((passwordField) => {
                    passwordField.setAttribute("type", "password")
                });
            } else {
                eyes.forEach(eye => eye.classList.add("peeked"));
                passwordFields.forEach((passwordField) => {
                    passwordField.setAttribute("type", "text")
                });
            }
        }, passive = true)
    })

    let form = document.querySelector(".loginForm, .formsContainer")
    document.addEventListener("mousemove", (event) => {
        let coords = form.getClientRects().item(0)

        let centerX = coords.x + coords.width / 2;
        let centerY = coords.y + coords.height / 2;
        let diffX = centerX - event.x;
        let diffY = centerY - event.y;
        diffX = 20 + 10 * Math.tanh(diffX / 200)
        diffY = 20 + 10 * Math.tanh(diffY / 200)
        form.style.boxShadow = `#444 ${diffX}px ${diffY}px`
    })
    // новое ниже


    let sendEmail = document.getElementById("sendEmail")
    let codeCheck = document.getElementById("codeCheck")
    let setPassword = document.getElementById("setPassword")

    let codeFields = Array.from(document.querySelectorAll(".codeField"))

    function sendEmailAPI() {
        alert("sendEmailAPI")
    }

    function checkCodeAPI() {
        alert(`checkCodeAPI ${codeFields.map((field) => field.value).join("")}`)
        setPassword.classList.remove("hidden")
    }

    function setPasswordAPI() {
        alert("setPasswordAPI")
    }

    let preventFocusChange = false;
    codeFields.forEach((field, index) => {
        field.addEventListener("input", (event) => {
            if (preventFocusChange) {
                preventFocusChange = false;
                return;
            }
            if (event.target.value.length > 1 && !Number.isInteger(event.target.value)) {
                event.target.value = ""
            }

            if (
                codeFields.every((field2) => {
                    if (field2.value === "" && field2 !== event.target) {
                        field2.focus()
                        return false;
                    } else if (field2.value === "") {
                        return false;
                    }
                    return true;
                })
            ) {
                checkCodeAPI();
            }
        })
        field.addEventListener("keydown", (event) => {
            if (event.key === "Backspace") {
                if(event.target === codeFields[codeFields.length - 1] && event.target.value !== "") {
                    field.value = "";
                    return;
                }
                preventFocusChange = true;
                if (index !== 0) {
                    codeFields[index - 1].focus()
                } else {
                    preventFocusChange = false;
                }
            }
        })
        field.addEventListener("focus", (event) => {
            if (preventFocusChange) {
                return;
            }
            if (codeFields.every((field2) => {
                if (field2.value === "" && field2 !== event.target) {
                    field2.focus()
                    return false;
                } else if (field2.value === "") {
                    return false;
                }
                return true;
            }) && event.target !== codeFields[codeFields.length - 1]
            ){
                codeFields[codeFields.length - 1].focus()
            }
        })
    })

    sendEmail.addEventListener("submit", (event) => {
        event.preventDefault()
        codeCheck.classList.remove("hidden")
    })

    setPassword.addEventListener("submit", (event) => {
        event.preventDefault()
        alert("Пароль успешно изменён")
    })

</script>
<script src="../js/mainPageMenuAndPatents.js"></script>
</body>
</html>
